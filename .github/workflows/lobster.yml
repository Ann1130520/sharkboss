name: 🦞 龍蝦大師 30分鐘巡邏兵

on:
  schedule:
    # 每 X 分鐘自動執行一次
    - cron: '*/30 * * * *'  
  workflow_dispatch: # 允許我們手動點擊按鈕執行

jobs:
  run-lobster:
    runs-on: ubuntu-latest 

    steps:
    - name: 📥 下載程式碼
      uses: actions/checkout@v3

    - name: 🐍 安裝 Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'  # 👉 新增這行：快取套件，防止每30分鐘重複下載大檔案燒光額度

    - name: 📦 安裝龍蝦需要的套件
      run: pip install -r requirements.txt

    - name: 🚀 喚醒龍蝦大師執行任務
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MY_NEWS_API_KEY: ${{ secrets.MY_NEWS_API_KEY }}
        MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}  # 👉 新增這行：把 Hugging Face 金鑰傳給機器人
        RUN_MODE: patrol  
      run: python main.py
